<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Tetris</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0a1a10;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, sans-serif;
  }
  /* Leaf decoration panels */
  #leaves-left, #leaves-right {
    position: fixed; top: 0; bottom: 0;
    z-index: 0;
    pointer-events: none;
  }
  #leaves-left  { left: 0; }
  #leaves-right { right: 0; }

  canvas {
    position: fixed;
    top: 0;
    z-index: 5;
    display: block;
    border-top:   1px solid #333;
    border-left:  1px solid #333;
    border-right: 1px solid #333;
  }
  #dropzone {
    position: fixed;
    z-index: 2;
    pointer-events: none;
    border: 2px dashed rgba(128,128,128,0.50);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(128,128,128,0.50);
  }
  #btnbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn {
    display: flex; align-items: center; justify-content: center;
    border: 2.5px dashed rgba(200,200,200,0.75);
    border-radius: 14px;
    color: rgba(220,220,220,0.85);
    background: transparent;
    cursor: pointer;
    touch-action: none;
    flex-shrink: 0;
  }
  .btn:active, .btn.active { background: rgba(255,255,255,0.07); }
  #overlay {
    position: fixed;
    z-index: 15;
    pointer-events: none;
    background: rgba(0,0,0,0.58);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }
  #overlay h2 {
    font-size: 1.5rem;
    letter-spacing: 0.1em;
    color: #e0e0ff;
  }
  #overlay p {
    font-size: 0.82rem;
    color: #aaa;
  }
</style>
</head>
<body>

<!-- Leaf panels (sized by JS) -->
<svg id="leaves-left"  xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="leaves-right" xmlns="http://www.w3.org/2000/svg"></svg>

<canvas id="c"></canvas>
<div id="dropzone"></div>
<div id="btnbar">
  <button class="btn" id="btnL">&#x21E6;</button>
  <button class="btn" id="btnR2">&#x21BB;</button>
  <button class="btn" id="btnR">&#x21E8;</button>
</div>
<div id="overlay" style="display:none;">
  <h2 id="ovTitle"></h2>
  <p   id="ovSub"></p>
</div>

<script>
'use strict';
// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const COLS = 10, ROWS = 20, BTN_ROWS = 4, DROP_ROWS = 4;
const COLORS = [null,'#00cfcf','#2060ff','#ff8c00','#ffd700','#30c830','#cc30cc','#e03030'];
const PIECES = [
  null,
  [[1,1,1,1]],                          // I  (cyan)
  [[2,0,0],[2,2,2]],                    // J  (blue)
  [[0,0,3],[3,3,3]],                    // L  (orange)
  [[4,4],[4,4]],                        // O  (yellow)
  [[0,5,5],[5,5,0]],                    // S  (green)
  [[0,6,0],[6,6,6]],                    // T  (purple)
  [[7,7,0],[0,7,7]],                    // Z  (red)
];

// ─── LAYOUT ───────────────────────────────────────────────────────────────────
let BLOCK, canvasLeft, btnSide, gap, dropFontSize, scoreFontSize;
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const dropEl  = document.getElementById('dropzone');
const btnbar  = document.getElementById('btnbar');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub   = document.getElementById('ovSub');
const svgL    = document.getElementById('leaves-left');
const svgR    = document.getElementById('leaves-right');

function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  BLOCK      = Math.floor(vh / (ROWS + BTN_ROWS));
  btnSide    = 4 * BLOCK;
  const cw   = COLS  * BLOCK;
  const ch   = ROWS  * BLOCK;
  canvasLeft = Math.floor((vw - cw) / 2);

  canvas.width  = cw;
  canvas.height = ch;
  canvas.style.left   = canvasLeft + 'px';
  canvas.style.width  = cw + 'px';
  canvas.style.height = ch + 'px';

  gap = Math.floor((vw - 3 * btnSide) / 4);
  const barH = btnSide;
  btnbar.style.height = barH + 'px';
  btnbar.style.gap    = gap + 'px';
  btnbar.style.paddingLeft  = gap + 'px';
  btnbar.style.paddingRight = gap + 'px';

  document.querySelectorAll('.btn').forEach(b => {
    b.style.width  = btnSide + 'px';
    b.style.height = btnSide + 'px';
    const fs = Math.round(btnSide * 0.5 * 1.33);
    b.style.fontSize     = fs + 'px';
    b.style.paddingTop   = '0';
    b.style.paddingBottom = Math.round(fs * 0.5) + 'px';
  });
  // nudge rotate button
  const rot = document.getElementById('btnR2');
  const rfs = Math.round(btnSide * 0.5 * 1.33);
  const nudge = Math.round(rfs * 0.08);
  rot.style.paddingTop    = nudge + 'px';
  rot.style.paddingBottom = (Math.round(rfs * 0.5) - nudge) + 'px';

  // drop zone
  dropEl.style.left   = gap + 'px';
  dropEl.style.right  = gap + 'px';
  dropEl.style.height = (DROP_ROWS * BLOCK) + 'px';
  dropEl.style.bottom = barH + 'px';
  dropFontSize = Math.round(DROP_ROWS * BLOCK * 0.55);
  dropEl.style.fontSize = dropFontSize + 'px';
  dropEl.textContent = '⇩';

  // overlay
  overlay.style.left   = canvasLeft + 'px';
  overlay.style.top    = '0px';
  overlay.style.width  = cw + 'px';
  overlay.style.height = ch + 'px';

  scoreFontSize = Math.max(10, Math.round(BLOCK * 0.55));

  // leaf panels
  const gutter = canvasLeft;
  svgL.style.width  = gutter + 'px';
  svgL.style.height = vh + 'px';
  svgR.style.width  = gutter + 'px';
  svgR.style.height = vh + 'px';
  svgR.style.right  = '0px';

  drawLeaves(svgL, gutter, vh, 42);
  drawLeaves(svgR, gutter, vh, 77);
}

// ─── LEAF DECORATION ──────────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';

function drawLeaves(svgEl, w, h, seed) {
  // clear
  while (svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);
  if (w < 8) return;

  // simple seeded-random
  let s = seed;
  function rnd() { s = (s * 16807 + 0) % 2147483647; return (s - 1) / 2147483646; }

  const greenShades = ['#1a7a2a','#22a83a','#2ecc47','#38d45a','#155c22','#0d4a1a','#4caf50','#81c784'];
  const blueShades  = ['#b71c1c','#c62828','#e53935','#ef5350','#7f0000','#4e0000','#ef9a9a','#d32f2f'];

  const count = Math.max(12, Math.floor((w * h) / 1800));
  for (let i = 0; i < count; i++) {
    const x  = rnd() * w;
    const y  = rnd() * h;
    const sz = 8 + rnd() * 14;           // leaf length 8-22px
    const angle = rnd() * 360;
    const isBlue = rnd() > 0.5;
    const palette = isBlue ? blueShades : greenShades;
    const color   = palette[Math.floor(rnd() * palette.length)];
    const opacity = 0.55 + rnd() * 0.4;

    // leaf = simple ellipse rotated
    const el = document.createElementNS(NS, 'ellipse');
    el.setAttribute('cx', x);
    el.setAttribute('cy', y);
    el.setAttribute('rx', sz * 0.28);
    el.setAttribute('ry', sz * 0.52);
    el.setAttribute('fill', color);
    el.setAttribute('opacity', opacity.toFixed(2));
    el.setAttribute('transform', `rotate(${angle.toFixed(1)},${x.toFixed(1)},${y.toFixed(1)})`);
    svgEl.appendChild(el);

    // vein
    const vein = document.createElementNS(NS, 'line');
    const dx = Math.sin(angle * Math.PI / 180) * sz * 0.45;
    const dy = -Math.cos(angle * Math.PI / 180) * sz * 0.45;
    vein.setAttribute('x1', (x - dx * 0.45).toFixed(1));
    vein.setAttribute('y1', (y - dy * 0.45).toFixed(1));
    vein.setAttribute('x2', (x + dx * 0.45).toFixed(1));
    vein.setAttribute('y2', (y + dy * 0.45).toFixed(1));
    vein.setAttribute('stroke', isBlue ? '#2a0000' : '#0a2a0a');
    vein.setAttribute('stroke-width', '0.7');
    vein.setAttribute('opacity', (opacity * 0.6).toFixed(2));
    svgEl.appendChild(vein);
  }
}

// ─── GAME STATE ───────────────────────────────────────────────────────────────
let board, score, lines, level, piece, pieceX, pieceY, nextType;
let gameOver = false, paused = false, running = false;
let dropInterval, gameLoop;
const BASE_INTERVAL = 800;

function newBoard() {
  board = Array.from({length: ROWS}, () => new Array(COLS).fill(0));
}

function randomType() { return 1 + Math.floor(Math.random() * 7); }

function startGame() {
  newBoard();
  score = 0; lines = 0; level = 1;
  gameOver = false; paused = false; running = true;
  nextType = randomType();
  spawnPiece();
  overlay.style.display = 'none';
  clearInterval(gameLoop);
  gameLoop = setInterval(tick, getInterval());
  requestAnimationFrame(render);
}

function getInterval() { return Math.max(100, BASE_INTERVAL - (level - 1) * 70); }

function spawnPiece() {
  const type = nextType;
  nextType = randomType();
  piece  = PIECES[type].map(r => [...r]);
  pieceX = Math.floor((COLS - piece[0].length) / 2);
  pieceY = 0;
  if (!canPlace(piece, pieceX, pieceY)) { endGame(); }
}

function canPlace(shape, ox, oy) {
  for (let r = 0; r < shape.length; r++)
    for (let c = 0; c < shape[r].length; c++)
      if (shape[r][c]) {
        const nx = ox + c, ny = oy + r;
        if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
        if (ny >= 0 && board[ny][nx]) return false;
      }
  return true;
}

function rotateCW(shape) {
  const rows = shape.length, cols = shape[0].length;
  return Array.from({length: cols}, (_, c) =>
    Array.from({length: rows}, (_, r) => shape[rows - 1 - r][c])
  );
}

function merge() {
  for (let r = 0; r < piece.length; r++)
    for (let c = 0; c < piece[r].length; c++)
      if (piece[r][c] && pieceY + r >= 0)
        board[pieceY + r][pieceX + c] = piece[r][c];
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(v => v)) {
      board.splice(r, 1);
      board.unshift(new Array(COLS).fill(0));
      cleared++; r++;
    }
  }
  if (cleared) {
    const pts = [0, 100, 300, 500, 800];
    score += (pts[cleared] || 800) * level;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    clearInterval(gameLoop);
    gameLoop = setInterval(tick, getInterval());
  }
}

function tick() {
  if (!running || paused || gameOver) return;
  if (canPlace(piece, pieceX, pieceY + 1)) {
    pieceY++;
  } else {
    merge(); clearLines(); spawnPiece();
  }
}

function endGame() {
  gameOver = true; running = false;
  clearInterval(gameLoop);
  ovTitle.textContent = 'GAME OVER';
  ovSub.textContent   = `Score: ${score}  —  tap to restart`;
  overlay.style.display = 'flex';
}

function togglePause() {
  if (gameOver) return;
  paused = !paused;
  if (paused) {
    ovTitle.textContent = 'PAUSED';
    ovSub.textContent   = 'Tap to continue';
    overlay.style.display = 'flex';
  } else {
    overlay.style.display = 'none';
  }
}

function ghostY() {
  let gy = pieceY;
  while (canPlace(piece, pieceX, gy + 1)) gy++;
  return gy;
}

// ─── RENDERING ────────────────────────────────────────────────────────────────
function render() {
  requestAnimationFrame(render);
  if (!running && !gameOver) return;
  const cw = COLS * BLOCK, ch = ROWS * BLOCK;

  // 1. Background
  ctx.fillStyle = '#0d0d1a';
  ctx.fillRect(0, 0, cw, ch);

  // 2. Subtle grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let c = 1; c < COLS; c++) {
    ctx.beginPath(); ctx.moveTo(c * BLOCK, 0); ctx.lineTo(c * BLOCK, ch); ctx.stroke();
  }
  for (let r = 1; r < ROWS; r++) {
    ctx.beginPath(); ctx.moveTo(0, r * BLOCK); ctx.lineTo(cw, r * BLOCK); ctx.stroke();
  }

  // 3. Border ticks
  const tickW = Math.round(BLOCK * 0.22), tickH = Math.round(BLOCK * 0.35);
  ctx.fillStyle = 'rgba(160,160,220,0.18)';
  for (let r = 0; r < ROWS; r++) {
    ctx.fillRect(0, r * BLOCK, tickW, tickH);
    ctx.fillRect(cw - tickW, r * BLOCK, tickW, tickH);
  }

  // 4. Pause hint "II" (visible when not paused)
  if (!paused) {
    ctx.save();
    ctx.fillStyle   = 'rgba(200,200,200,0.25)';
    ctx.font        = `bold ${Math.round(BLOCK * 16 * 0.127)}px system-ui,sans-serif`;
    ctx.textAlign   = 'center';
    ctx.textBaseline = 'middle';
    // center in rows 1-16 (upper area)
    ctx.fillText('II', cw / 2, BLOCK * 8);
    ctx.restore();
  }

  // 5. Locked blocks
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const v = board[r][c];
      if (!v) continue;
      drawBlock(c, r, COLORS[v], 1);
    }
  }

  // 6. Ghost piece
  if (!gameOver) {
    const gy = ghostY();
    for (let r = 0; r < piece.length; r++)
      for (let c = 0; c < piece[r].length; c++)
        if (piece[r][c])
          drawBlock(pieceX + c, pieceY + r === gy + r ? gy + r : gy + r, COLORS[piece[r][c]], 0.18);
    // actual ghost
    for (let r = 0; r < piece.length; r++)
      for (let c = 0; c < piece[r].length; c++)
        if (piece[r][c])
          drawBlockGhost(pieceX + c, gy + r, COLORS[piece[r][c]]);
  }

  // 7. Active piece
  if (!gameOver) {
    for (let r = 0; r < piece.length; r++)
      for (let c = 0; c < piece[r].length; c++)
        if (piece[r][c])
          drawBlock(pieceX + c, pieceY + r, COLORS[piece[r][c]], 1);
  }

  // 8. Score overlay
  ctx.save();
  ctx.fillStyle    = 'rgba(210,210,210,0.65)';
  ctx.font         = `bold ${scoreFontSize}px system-ui,sans-serif`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(`SCORE  ${score}`, cw / 2, Math.round(BLOCK * 0.22));
  ctx.restore();
}

function drawBlock(cx, cy, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle   = color;
  ctx.fillRect(cx * BLOCK + 1, cy * BLOCK + 1, BLOCK - 2, BLOCK - 2);
  // 15% white top highlight
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(cx * BLOCK + 1, cy * BLOCK + 1, BLOCK - 2, Math.ceil((BLOCK - 2) * 0.15));
  ctx.restore();
}

function drawBlockGhost(cx, cy, color) {
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle   = color;
  ctx.fillRect(cx * BLOCK + 1, cy * BLOCK + 1, BLOCK - 2, BLOCK - 2);
  ctx.restore();
}

// ─── INPUT: KEYBOARD ──────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (!running || gameOver) return;
  switch (e.key) {
    case 'ArrowLeft':  tryMove(-1); break;
    case 'ArrowRight': tryMove(1);  break;
    case 'ArrowUp': case 'x': case 'X': tryRotate(); break;
    case 'ArrowDown': if (!paused) { pieceY++; if (!canPlace(piece,pieceX,pieceY)) { pieceY--; merge(); clearLines(); spawnPiece(); } } break;
    case ' ': hardDrop(); break;
    case 'p': case 'P': togglePause(); break;
  }
});

function tryMove(dx) {
  if (paused || gameOver) return;
  if (canPlace(piece, pieceX + dx, pieceY)) pieceX += dx;
}

function tryRotate() {
  if (paused || gameOver) return;
  const rot = rotateCW(piece);
  // wall kick attempts
  for (const kick of [0, -1, 1, -2, 2]) {
    if (canPlace(rot, pieceX + kick, pieceY)) { piece = rot; pieceX += kick; break; }
  }
}

function hardDrop() {
  if (paused || gameOver) return;
  while (canPlace(piece, pieceX, pieceY + 1)) pieceY++;
  merge(); clearLines(); spawnPiece();
}

// ─── INPUT: TOUCH ─────────────────────────────────────────────────────────────
let touchStartY = null, softDropTimer = null, softDropActive = false;

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const touch = e.changedTouches[0];
  const canvasRect = canvas.getBoundingClientRect();
  const relY = touch.clientY - canvasRect.top;
  const row  = Math.floor(relY / BLOCK);

  if (gameOver) { startGame(); return; }

  // bottom 4 rows = drop zone
  if (row >= ROWS - DROP_ROWS) {
    touchStartY = relY;
    softDropActive = true;
    softDrop();
    softDropTimer = setInterval(softDrop, 100);
  } else {
    togglePause();
  }
}, {passive: false});

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (softDropTimer) { clearInterval(softDropTimer); softDropTimer = null; }
  softDropActive = false;
}, {passive: false});

function softDrop() {
  if (paused || gameOver || !running) return;
  if (canPlace(piece, pieceX, pieceY + 1)) {
    pieceY++;
  } else {
    merge(); clearLines(); spawnPiece();
  }
}

// ─── INPUT: BUTTONS ───────────────────────────────────────────────────────────
function setupBtn(id, action) {
  const btn = document.getElementById(id);
  let timer = null;

  function start(e) {
    e.preventDefault();
    btn.classList.add('active');
    action();
    timer = setInterval(action, 120);
  }
  function stop(e) {
    e.preventDefault();
    btn.classList.remove('active');
    if (timer) { clearInterval(timer); timer = null; }
  }

  btn.addEventListener('touchstart', start, {passive: false});
  btn.addEventListener('touchend',   stop,  {passive: false});
  btn.addEventListener('touchcancel',stop,  {passive: false});
  btn.addEventListener('mousedown',  start);
  btn.addEventListener('mouseup',    stop);
  btn.addEventListener('mouseleave', stop);
}

setupBtn('btnL',  () => tryMove(-1));
setupBtn('btnR',  () => tryMove(1));
setupBtn('btnR2', () => tryRotate());

// ─── RESIZE ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => { layout(); });

// ─── INIT ─────────────────────────────────────────────────────────────────────
layout();
startGame();
</script>
</body>
</html>
