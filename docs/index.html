<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="10" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, Fusionists!</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      display: -webkit-box;
      display: -webkit-flex;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      -ms-flex-direction: column;
      flex-direction: column;
      -webkit-box-align: center;
      -webkit-align-items: center;
      -ms-flex-align: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      -ms-flex-pack: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f7f8fa;
      color: #1f2328;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.25rem;
      text-align: center;
    }

    p {
      color: #57606a;
      font-size: 1rem;
      text-align: center;
    }

    .badge {
      margin-top: 2rem;
      padding: 0.4rem 0.9rem;
      background: #3b82d4;
      color: #fff;
      border-radius: 999px;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <h1>Hello &#x269B;&#xFE0E;-ists!</h1>
  <p>Wait for this page to auto-update.</p>
  <span class="badge">GitHub Pages · public</span>
  <p style="color:#57606a;font-size:0.8rem;margin-top:3rem;">Last loaded:
    <script>document.write(new Date().toLocaleTimeString())</script>
  </p>
</body>

</html>
